<!doctype html><html><head><meta charset="utf-8"><title>PNG export regression</title></head><body>
<div id="english"></div><button id="downloadTest" disabled>Download regression PNG</button><pre id="result">RUNNING</pre>
<script src="../config.js"></script><script src="../src/core.js"></script><script src="../src/exporters.js"></script>
<script>
(async()=>{try{
  const source=await fetch('./fixtures/graphics-localization/F11-horizontal-bar-regression.svg').then(r=>r.text()),doc=new DOMParser().parseFromString(source,'image/svg+xml'),root=doc.documentElement,width=Number(root.getAttribute('width')),height=Number(root.getAttribute('height')),viewBox=(root.getAttribute('viewBox')||`0 0 ${width} ${height}`).split(/\s+/).map(Number),body=source.replace(/^<svg[^>]*>|<\/svg>\s*$/g,'');

  const card={name:'datawrapper-regression.svg',canvas:{width,height,viewBox}},standalone=await createStandaloneExportSvg(card),exportDoc=new DOMParser().parseFromString(standalone.markup,'image/svg+xml'),png=await exportPng(card),bytes=new Uint8Array(await png.arrayBuffer()),signature=[...bytes.slice(0,8)].map(v=>v.toString(16).padStart(2,'0')).join(''),bitmap=await createImageBitmap(png),checks={mime:png.type,signature,width:bitmap.width,height:bitmap.height,expectedWidth:1200,expectedHeight:Math.round(height*(1200/width)),editedText:standalone.markup.includes('Edited English title after drag'),dragTransform:standalone.markup.includes('translate(7 3)'),selectionRemoved:!exportDoc.querySelector('.selection-box'),guideRemoved:!exportDoc.querySelector('.protected-area-guide'),datawrapperStructure:!!exportDoc.querySelector('#chart-structure')};bitmap.close();checks.pass=checks.mime==='image/png'&&checks.signature==='89504e470d0a1a0a'&&checks.width===checks.expectedWidth&&checks.height===checks.expectedHeight&&checks.editedText&&checks.dragTransform&&checks.selectionRemoved&&checks.guideRemoved&&checks.datawrapperStructure;const downloadButton=document.getElementById('downloadTest');downloadButton.disabled=!checks.pass;downloadButton.onclick=()=>download(png,'datawrapper-regression_EN.png');document.getElementById('result').textContent=JSON.stringify(checks,null,2);

</script></body></html>
